name: Deploy site to Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Flutter pub get (workspace)
        run: flutter pub get

      - name: Build Flutter site demo for Pages
        # Pages serves at https://<user>.github.io/morphicons-flutter/
        # so base-href must include the repo name for the embedded app.
        run: |
          cd packages/morphicons_site_demo
          flutter build web --release --base-href /morphicons-flutter/flutter/ -o ../../website/flutter

      - name: Add .nojekyll
        run: touch website/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
