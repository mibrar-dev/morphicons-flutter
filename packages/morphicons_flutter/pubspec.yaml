name: morphicons_flutter
description: >-
  Similarity-aware icon morphing: MorphIcon animates between any two stroke
  or filled icons — raw SVG path data or IconData — with one widget. Closed-form
  rotation (2D Procrustes), polar interpolation, spring physics. Uncontrolled,
  controlled and imperative modes, plus MorphMask, MorphCanvas, MorphTween.
version: 1.0.0
homepage: https://github.com/mibrar-dev/morphicons-flutter
repository: https://github.com/mibrar-dev/morphicons-flutter
issue_tracker: https://github.com/mibrar-dev/morphicons-flutter/issues
documentation: https://github.com/mibrar-dev/morphicons-flutter
topics:
  - icons
  - animation
  - morphing
  - widget
environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
