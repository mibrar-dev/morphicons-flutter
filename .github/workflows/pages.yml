name: Deploy site to Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get (workspace)
        run: flutter pub get

      - name: Build Flutter site demo for Pages
        # Pages serves at https://<user>.github.io/morphicons-flutter/
        # so base-href must include the repo name for the embedded app.
        run: |
          cd packages/morphicons_site_demo
          flutter build web --release --base-href /morphicons-flutter/flutter/ -o ../../website/flutter

      - name: Add .nojekyll
        run: touch website/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore(pages): deploy website"

      # Also try official Pages artifact for repos configured to use GitHub Actions.
      - name: Attempt official Pages artifact (non-fatal)
        continue-on-error: true
        run: |
          echo "Skipping official artifact; gh-pages branch is the canonical deployment."
