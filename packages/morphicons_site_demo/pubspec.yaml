name: morphicons_site_demo
description: "Flutter Web bridge app embedded in the Morphicons website — runs the real morphicons_flutter package in the browser."
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  morphicons_core:
  morphicons_flutter:
  morphicons_lucide:
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
