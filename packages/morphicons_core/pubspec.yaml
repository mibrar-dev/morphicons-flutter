name: morphicons_core
description: >-
  Pure-Dart similarity-transform solver for icon morphing. A faithful port of
  the morphicons core: SVG path parsing, cubic normalization, arc-length
  resampling, correspondence, 2D Procrustes alignment, polar interpolation and
  spring physics. No Flutter dependency.
version: 1.0.0
homepage: https://github.com/mibrar-dev/morphicons-flutter
repository: https://github.com/mibrar-dev/morphicons-flutter
issue_tracker: https://github.com/mibrar-dev/morphicons-flutter/issues
documentation: https://github.com/mibrar-dev/morphicons-flutter
topics:
  - icons
  - animation
  - morphing
  - svg-path
  - geometry
environment:
  sdk: ^3.6.0

resolution: workspace

dev_dependencies:
  test: ^1.25.0
