name: morphicons_flutter
description: >-
  MorphIcon widget for Flutter: similarity-aware icon morphing powered by
  morphicons_core. Uncontrolled, controlled and imperative modes.
version: 1.0.0
homepage: https://github.com/mibrar-dev/morphicons-flutter
repository: https://github.com/mibrar-dev/morphicons-flutter
issue_tracker: https://github.com/mibrar-dev/morphicons-flutter/issues
documentation: https://github.com/mibrar-dev/morphicons-flutter
topics:
  - icons
  - animation
  - morphing
  - widget
environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  morphicons_core: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
